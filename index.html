<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>sandbox-lablife</title>
<style>
:root{--bg:#000B00;--fg:#d8d4ca;--sub:#8b8a92;--line:#2e302e}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;line-height:2;font-size:17px}
main{max-width:34rem;margin:0 auto;padding:5rem 1.5rem 3rem}
p{margin:0 0 1.1rem}
.sub{color:var(--sub);font-size:.85rem;letter-spacing:.1em}
footer{margin-top:4rem;padding-top:1.4rem;border-top:1px solid var(--line);color:var(--sub);font-size:.8rem;letter-spacing:.1em}
</style>
</head>
<body>
<main>
<p>アプリのクローズドテスト用の仮ページです。</p>
<p>現在は特にお知らせはありません。</p>
<footer>© sandbox-lablife</footer>
</main>
</body>
</html>
